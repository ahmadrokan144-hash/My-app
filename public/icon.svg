<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Diagonal/Horizontal gradient for the outer rectangular frame -->
    <linearGradient id="frameGrad" x1="112" y1="680" x2="884" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#436e84" />
      <stop offset="28%" stop-color="#2586a1" />
      <stop offset="65%" stop-color="#2cb6cd" />
      <stop offset="100%" stop-color="#76e7ec" />
    </linearGradient>

    <!-- Left-to-right gradient for the "own" wordmark -->
    <linearGradient id="ownGrad" x1="196" y1="500" x2="768" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2c7793" />
      <stop offset="32%" stop-color="#1e9ab8" />
      <stop offset="68%" stop-color="#37c6d7" />
      <stop offset="100%" stop-color="#71e5e9" />
    </linearGradient>

    <!-- Soft shadow for the plus sign -->
    <filter id="plusShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#0a394a" flood-opacity="0.18" />
    </filter>

    <!-- Mask for the interlocking 'o', 'w', 'n' -->
    <mask id="ownMask">
      <rect width="1024" height="1024" fill="white" />
      <!-- Inner oval hole of 'o' -->
      <ellipse cx="282" cy="500" rx="38" ry="51" fill="black" />
      <!-- White separation cut at top-right of 'o' where 'w' interlocks -->
      <path
        d="M 307 402 C 316 420, 323 438, 327 458"
        fill="none"
        stroke="black"
        stroke-width="6.5"
        stroke-linecap="round"
      />
    </mask>
  </defs>

  <!-- Pure White Background -->
  <rect width="1024" height="1024" fill="#ffffff" />

  <!-- Outer Rectangular Frame with opening on right for '+' -->
  <path
    d="M 112 286
       H 884
       V 388
       H 859
       V 311
       H 137
       V 689
       H 859
       V 616
       H 884
       V 714
       H 112
       Z"
    fill="url(#frameGrad)"
  />

  <!-- "own" wordmark -->
  <g fill="url(#ownGrad)" mask="url(#ownMask)">
    <!-- 'o' outer shape -->
    <ellipse cx="282" cy="500" rx="85" ry="92" />

    <!-- 'w' + 'n' continuous arch and stems -->
    <path
      d="M 317 452
         C 319 422, 342 408, 372 408
         C 394 408, 405 420, 412 446
         L 435 532
         L 465 412
         H 506
         L 537 532
         L 562 444
         C 574 415, 608 406, 668 406
         C 732 406, 766 430, 766 484
         V 586
         H 717
         V 486
         C 717 456, 700 444, 664 444
         C 626 444, 604 456, 595 484
         L 565 586
         H 521
         L 485 462
         L 450 586
         H 406
         L 372 454
         C 369 444, 360 442, 356 452
         Z"
    />

    <!-- Inner vertical pillar of 'n' -->
    <rect x="617" y="458" width="47" height="128" />
  </g>

  <!-- '+' Plus Sign on the right -->
  <path
    d="M 860 416
       H 884
       V 488
       H 956
       V 512
       H 884
       V 584
       H 860
       V 512
       H 788
       V 488
       H 860
       Z"
    fill="#ffffff"
    stroke="#135b78"
    stroke-width="4.5"
    stroke-linejoin="miter"
    filter="url(#plusShadow)"
  />
</svg>
